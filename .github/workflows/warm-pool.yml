# Keep the practice pool warm.
#
# The pool's background warmer cannot run where this app is deployed: a Vercel
# function is frozen the moment it answers a request and killed when it goes
# idle, so a loop started at app startup never survives to finish a set. That
# is why PRACTICE_POOL_ENABLED is false in production. This workflow is the
# scheduler that replaces it -- it checks the catalog, generates what is short,
# and exits.
#
# Why here and not a Vercel cron: Hobby crons fire once a DAY, and a function
# is capped at 300s, which a full mock paper (seven heavy generations) cannot
# finish inside. A runner has neither limit. This repo is PUBLIC, so Actions
# minutes are unlimited and free -- this costs nothing to run forever.
#
# Cost control is in the tool, not the schedule: when every bucket is at
# target the run generates nothing and exits in seconds, so a frequent cron is
# cheap. It only does real work after students have actually consumed sets.
# (The schedule turns out to be far less frequent than it asks for -- see the
# measurement on the cron line below.)
#
# The five secrets below cannot be read back once set, and every way they go
# wrong in this project has gone wrong quietly. Before setting them -- and
# after rotating any of them -- prove the values by USING them:
#
#     cd backend && python tools/pool_secrets_check.py --from-local
#
# It is deliberately NOT a step in this job: it makes a real model call and
# writes a blob, which is not worth doing every thirty minutes to re-learn
# something that only changes when a human changes it.

name: warm practice pool

on:
  schedule:
    # Twice an hour, and deliberately NOT at :00/:30.
    #
    # 🔬 Measured 2026-09-11 over the first 37 hours of this workflow: `*/30`
    # scheduled 74 runs and GitHub delivered FIVE. The gaps were 2.0h, 2.3h,
    # 3.5h and 4.9h -- not a 30-minute cadence by any reading. GitHub runs
    # scheduled jobs on a shared best-effort pool and drops them under load,
    # and :00 and :30 are the most contended minutes of the hour. Odd offsets
    # are the documented mitigation.
    #
    # So treat the schedule as "eventually" and never as a guarantee.
    - cron: "7,37 * * * *"

  # A push IS delivered, every time, which the schedule is not -- so this is
  # the trigger to rely on when the pool has to be filled now. It is not just a
  # manual handle: `main` changing is a perfectly good moment to check the
  # pool, because the job costs nothing when there is nothing to do. A full
  # pool with every recording stored backfills ten HEAD requests, prints
  # "nothing to generate" and exits in about a minute. Concurrency below
  # serialises a burst of pushes, and the second run finds the pool full.
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      report_only:
        description: "Only report the pool, generate nothing"
        type: boolean
        default: false

# `push` here only ever fires on this repository's own main. Deliberately NOT
# `pull_request`, which is the one that would hand these secrets to a fork of
# this public repo.
permissions:
  contents: read

concurrency:
  # Two overlapping runs would generate the same bucket twice and waste calls
  # against the free model quota. Never cancel a run in flight: it is holding
  # hosted calls that are already paid for in time.
  group: warm-practice-pool
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # 🚨 Step one, before the checkout and before the 40-second install,
      # because the failure this catches is a MISNAMED SECRET and every way of
      # finding that out later is worse. `secrets.X != ''` evaluates to a
      # boolean, so no value is ever printed -- only which NAME supplied it.
      #
      # 🔬 2026-09-11: POOL_DATABASE_URL had been saved as DATABASE_URL. An
      # unset secret does not leave the variable alone -- it interpolates to
      # "" -- so the run died four frames inside SQLAlchemy with "Could not
      # parse SQLAlchemy URL from given URL string", which reads exactly like a
      # malformed connection string. Eight failed runs and one confident wrong
      # diagnosis went into a value that was correct the whole time.
      #
      # Hence the fallback below: the POOL_ prefix exists so this job CAN point
      # at a different database than the API, which is worth keeping, but
      # nobody should lose an afternoon to a prefix. Prefixed wins when both
      # exist; the unprefixed name is accepted and reported as such.
      - name: Check every secret is present
        run: |
          missing=0
          # $1 preferred name, $2 fallback name ("-" for none),
          # $3 preferred present?, $4 fallback present?
          check () {
            if [ "$3" = "true" ]; then
              echo "  present  $1"
            elif [ "$4" = "true" ]; then
              echo "  present  $2  (accepted as $1)"
            elif [ "$2" = "-" ]; then
              echo "  MISSING  $1"
              missing=1
            else
              echo "  MISSING  $1  (and no $2 either)"
              missing=1
            fi
          }
          check POOL_DATABASE_URL     DATABASE_URL   "${{ secrets.POOL_DATABASE_URL   != '' }}" "${{ secrets.DATABASE_URL   != '' }}"
          check POOL_QDRANT_URL       QDRANT_URL     "${{ secrets.POOL_QDRANT_URL     != '' }}" "${{ secrets.QDRANT_URL     != '' }}"
          check POOL_QDRANT_API_KEY   QDRANT_API_KEY "${{ secrets.POOL_QDRANT_API_KEY != '' }}" "${{ secrets.QDRANT_API_KEY != '' }}"
          check POOL_OPENAI_API_KEY   OPENAI_API_KEY "${{ secrets.POOL_OPENAI_API_KEY != '' }}" "${{ secrets.OPENAI_API_KEY != '' }}"
          check BLOB_READ_WRITE_TOKEN -              "${{ secrets.BLOB_READ_WRITE_TOKEN != '' }}" false
          if [ "$missing" = "1" ]; then
            echo
            echo "Set the missing ones under Settings -> Secrets and variables -> Actions."
            echo "Either name works for the first four. BLOB_READ_WRITE_TOKEN has"
            echo "no alias: without it the run still fills the pool and still"
            echo "reports success, but leaves every recording unvoiced -- and the"
            echo "student pays ~100s of synthesis on the first press of PLAY,"
            echo "which is the wait this whole job exists to remove."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Top up the pool
        working-directory: backend
        env:
          # `||` yields the first non-falsy operand and an unset secret is "",
          # so the prefixed name wins when it exists and the plain one is
          # accepted when it does not. See the check step above for why.
          DATABASE_URL: ${{ secrets.POOL_DATABASE_URL || secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.POOL_QDRANT_URL || secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.POOL_QDRANT_API_KEY || secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.POOL_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          # Without this the runner voices every Listening part into its own
          # disk and then deletes the disk, which is exactly the wait this job
          # exists to remove. Copy it from the ielts-api project on Vercel,
          # where linking the Blob store set it automatically.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          LLM_PROVIDER: openai
          # Not secrets, so they are readable here rather than hidden -- but
          # they ARE duplicated from the API's Vercel env. gpt-oss-120b was
          # retired mid-project and returned 410 Gone on every call; if that
          # happens again, this file is the SECOND place to update.
          OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
          OPENAI_MODEL: nvidia/nemotron-3-super-120b-a12b
          # Under the 55-minute job timeout with room for the install and for
          # a set that is already in flight when the budget runs out.
          POOL_BUDGET_SECONDS: "2400"
        run: |
          python tools/warm_pool_once.py \
            ${{ inputs.report_only && '--report-only' || '' }}
